{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %} Biblioteca Uninpahu{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'biblioteca:catalogo' %}"> Biblioteca compartida Uninpahu</a>
      <a href="{% url 'admin:index' %}" class="btn btn-secondary btn-sm">control</a>
    </div>
  </nav>

  <main class="container pb-5" style="max-width: 760px;">
    {% block contenido %}{% endblock %}
  </main>
  <button type="button" class="btn btn-warning shadow rounded-pill position-fixed bottom-0 end-0 m-4"
    data-bs-toggle="modal" data-bs-target="#modalRecomendador">
    soy tu asistente de ia puedo recomendarte algo hoy ?
  </button>

  <div class="modal fade" id="modalRecomendador" tabindex="-1" data-url="{% url 'biblioteca:recomendaciones' %}">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">📚 Recomendados para ti</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formRecomendador" class="d-flex gap-2 mb-3">
            {% csrf_token %}
            <input name="gustos" class="form-control" maxlength="300" placeholder="¿Qué te gustaría leer? (opcional)">
            <button class="btn btn-primary">Buscar</button>
          </form>
          <div id="resultadosRecomendador"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'biblioteca/recomendador.js' %}"></script>
</body>

</html>
